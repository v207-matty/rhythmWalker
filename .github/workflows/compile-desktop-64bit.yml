name: Auto-compiled builds (64bit Dekstop)

on:
        push:
                # branches-ignore: [randomBranchName]
        pull_request:
                # branches-ignore: [randomBranchName]
        workflow_dispatch:

jobs:
        buildLinux:
                runs-on: ubuntu-22.04

                steps:
                        - uses: actions/checkout@main

                        - uses: krdlab/setup-haxe@master
                          with:
                                  haxe-version: 4.3.7

                        - name: Restore Previous Cache
                          id: cache-build-restore
                          uses: actions/cache/restore@main
                          with:
                                  path: |
                                          .haxelib/
                                          export/release/64bit/linux/haxe/
                                          export/release/64bit/linux/obj/
                                  key: cache-build-linux

                        - name: Installing Libraries
                          run: |
                                haxelib install hmm
                                haxelib run hmm install
                                cd .haxelib/hxcpp/git/tools/hxcpp/
                                haxe compile.hxml
                                cd ../../../../../

                        - name: Create Version Tag
                          run: echo "${{github.run_id}}" > VERSION

                        - name: Compile
                          run: haxelib run lime build linux

                        - name: Clear Previous Cache
                          uses: actions/github-script@main
                          with:
                                  script: await require('./actions/cache/clear-cache.js')({github, context}, 'cache-build-linux');

                        - name: Save Current Cache
                          uses: actions/cache@main
                          with:
                                  key: cache-build-linux
                                  path: |
                                          .haxelib/
                                          export/release/64bit/linux/haxe/
                                          export/release/64bit/linux/obj/
                                  restore-keys: |
                                          cache-build-linux

                        - name: Publish Artifact
                          uses: actions/upload-artifact@main
                          with:
                                  name: linuxBuild
                                  path: export/release/64bit/linux/bin
        buildWindows:
