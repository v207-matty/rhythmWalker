name: Auto-compile

on:
    push:
    workflow_dispatch:

jobs:
    buildLinux64:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@main

            - uses: krdlab/setup-haxe@master
              with:
                  haxe-version: 4.3.7

            - name: Restore Previous Cache
              id: cache-build-restore
              uses: actions/cache/restore@main
              with:
                  path: |
                      .haxelib/
                      export/64bit/release/linux/haxe/
                      export/64bit/release/linux/obj/
                  key: cache-build-linux-64

            - name: Installing Libraries
              run: |
                  haxelib install hmm
                  haxelib run hmm install
                  cd .haxelib/hxcpp/git/tools/hxcpp/
                  haxe compile.hxml
                  cd ../../../../../

            - name: Create Version Tag
              run: echo "${{github.run_id}}" > VERSION

            - name: Compile
              run: haxelib run lime build linux

            - name: Clear Previous Cache
              uses: actions/github-script@main
              with:
                  script: await require('./actions/cache/clear-cache.js')({github, context}, 'cache-build-linux-64');

            - name: Save Current Cache
              uses: actions/cache@main
              with:
                  key: cache-build-linux-64
                  path: |
                      .haxelib/
                      export/64bit/release/linux/haxe/
                      export/64bit/release/linux/obj/
                  restore-keys: |
                      cache-build-linux-64

            - name: Publish Artifact
              uses: actions/upload-artifact@main
              with:
                  name: linuxBuild-64
                  path: export/64bit/release/linux/bin

